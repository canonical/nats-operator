name: Promote Charms & Bundles

on:
  workflow_call:
    secrets:
      CHARMHUB_TOKEN:
        required: true
    inputs:
      from-risk:
        type: string
        description: 'Charmhub channel risk to promote from'
        default: ''
      to-risk:
        type: string
        description: 'Charmhub channel risk to promote to'
        default: ''

jobs:
  promote-charms-and-bundles:
    environment: ${{ contains(inputs.to-risk, 'stable') && 'stable' || null }}
    name: Promote charms
    runs-on: [self-hosted, linux, X64, jammy, large]
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - name: Install dependencies
      run: |
        sudo apt install  -y zip
        sudo snap install --classic --channel=3.x/stable charmcraft
        sudo snap install --channel=3/stable juju
    - name: Select charmhub track
      id: track
      run: |
        track="$(cat .track)"
        echo "track=$track" >> "$GITHUB_OUTPUT"
    - name: Promote charms
      env:
        CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        FROM_RISK: ${{ inputs.from-risk }}
        TO_RISK: ${{ inputs.to-risk }}
      run: |
        track="${{ steps.track.outputs.track }}"
        for arch in amd64 arm64; do
          for series in jammy noble ; do
            ./scripts/promote-charms.sh \
              --from="${track}/${FROM_RISK}" \
              --to="${track}/${TO_RISK}" \
              --series="${series}" \
              --arch="${arch}"
          done
        done

